# Local-harness theme — mirrors 06_spcs/.streamlit/config.toml so local rendering
# matches the deployed SPCS app (which pins a light base). Without this, the
# harness follows the OS theme (dark) and base-theme widgets render dark.
[theme]
base = "light"
primaryColor = "#1d70b8"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f2f1"
textColor = "#0b0c0c"
font = "sans serif"

[server]
headless = true
