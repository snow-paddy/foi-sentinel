spec:
  containers:
    - name: foi-sentinel
      image: /foi/foi_sentinel_v2/images/foi_sentinel:latest
      env:
        SNOWFLAKE_WAREHOUSE: FOI_WH
        SNOWFLAKE_DATABASE: FOI
        SNOWFLAKE_SCHEMA: FOI_SENTINEL_V2
      resources:
        requests:
          cpu: "0.5"
          memory: "1G"
        limits:
          cpu: "1"
          memory: "2G"
      readinessProbe:
        port: 8080
        path: /_stcore/health
  endpoints:
    - name: web
      port: 8080
      public: true
      protocol: HTTP
  networkPolicyConfig:
    allowInternetEgress: false
